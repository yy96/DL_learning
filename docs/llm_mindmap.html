<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Interactive LLM Architecture Mind Map (v2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root {
    --bg: #0f172a;
    --panel: #111827;
    --card: #1e293b;
    --card2: #020617;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --line: #475569;
    --blue: #38bdf8;
    --green: #4ade80;
    --yellow: #facc15;
    --pink: #f472b6;
    --purple: #a78bfa;
    --orange: #fb923c;
    --red: #f87171;
    --cyan: #22d3ee;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top left, #1e293b, var(--bg) 45%);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 440px;
    height: 100vh;
  }

  @media (max-width: 1000px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 58vh 42vh;
    }
  }

  .canvas-wrap {
    position: relative;
    overflow: auto;
    border-right: 1px solid #334155;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 12px;
    background: rgba(15, 23, 42, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #334155;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  input {
    background: #020617;
    color: var(--text);
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 12px;
    min-width: 280px;
    outline: none;
  }

  button {
    background: #1e293b;
    color: var(--text);
    border: 1px solid #475569;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-weight: 600;
  }

  button:hover { background: #334155; }

  /* Canvas only — do not leak min-size onto side-panel figure SVGs. */
  #mindmap {
    min-width: 1700px;
    min-height: 1200px;
    display: block;
  }

  .link {
    stroke: var(--line);
    stroke-width: 1.4;
    fill: none;
    opacity: 0.72;
  }

  .node-card {
    cursor: pointer;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.28));
  }

  .node-rect {
    stroke: #475569;
    stroke-width: 1.2;
    rx: 14;
  }

  .node-title {
    fill: #f8fafc;
    font-size: 13px;
    font-weight: 750;
    pointer-events: none;
  }

  .node-sub {
    fill: #cbd5e1;
    font-size: 10.5px;
    pointer-events: none;
  }

  .node-meta {
    fill: #94a3b8;
    font-size: 10px;
    pointer-events: none;
  }

  .hit { stroke: #facc15 !important; stroke-width: 3 !important; }
  .selected { stroke: #38bdf8 !important; stroke-width: 3 !important; }

  .side {
    background: linear-gradient(180deg, #111827, #020617);
    overflow: auto;
    padding: 22px;
  }

  .side h1 { margin: 0 0 8px; font-size: 1.55rem; }
  .side .kind {
    display: inline-block;
    margin: 8px 0 14px;
    padding: 5px 10px;
    border-radius: 999px;
    background: #172554;
    color: #bfdbfe;
    font-weight: 700;
    font-size: 0.78rem;
  }
  .side p { color: #cbd5e1; line-height: 1.55; }
  .side h2 {
    margin-top: 22px;
    font-size: 1.05rem;
    color: #f8fafc;
    border-bottom: 1px solid #334155;
    padding-bottom: 8px;
  }
  .side ul { padding-left: 20px; color: #cbd5e1; }
  .side li { margin: 7px 0; }
  .side a { color: #7dd3fc; text-decoration: none; border-bottom: 1px solid #164e63; }
  .side a:hover { color: #e0f2fe; }

  code {
    background: #020617;
    border: 1px solid #334155;
    padding: 2px 5px;
    border-radius: 6px;
    color: #93c5fd;
  }

  .formula {
    background: #020617;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px;
    color: #dbeafe;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    white-space: pre-wrap;
    overflow-x: auto;
    font-size: 0.82rem;
  }

  .breadcrumb { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: 0.88rem; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .pill {
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 6px 9px;
    color: #cbd5e1;
    font-size: 0.78rem;
    background: #020617;
  }
  .search-count { color: #fde68a; font-size: 0.82rem; font-weight: 650; }

  /* ---- Two-part detail panel ---- */
  .part-label {
    margin: 26px 0 10px;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
    color: #7dd3fc;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .part-label::before {
    content: "";
    width: 18px;
    height: 2px;
    background: linear-gradient(90deg, #38bdf8, transparent);
    border-radius: 2px;
  }
  .part-label.refs { color: #fbbf24; }
  .part-label.refs::before { background: linear-gradient(90deg, #fbbf24, transparent); }

  .whatis {
    color: #e2e8f0;
    line-height: 1.62;
    font-size: 0.96rem;
    margin: 0 0 4px;
  }

  .visual {
    margin: 16px 0 6px;
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 14px;
    padding: 8px 8px 10px;
    overflow: hidden;
  }
  .viz-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 6px;
  }
  .viz-hint {
    flex: 1;
    color: #64748b;
    font-size: 0.72rem;
  }
  .viz-toolbar button {
    padding: 4px 9px;
    min-width: 30px;
    font-size: 0.8rem;
    line-height: 1.2;
  }
  .viz-zoom-level {
    color: var(--muted);
    font-size: 0.75rem;
    min-width: 38px;
    text-align: center;
  }
  .viz-viewport {
    height: 220px;
    overflow: hidden;
    position: relative;
    border-radius: 8px;
    background: #01040c;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .viz-viewport.grabbing { cursor: grabbing; }
  .viz-stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    will-change: transform;
  }
  .visual .viz-stage svg,
  .visual .viz-stage img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    display: block;
    pointer-events: none;
  }
  .viz-caption {
    margin-top: 8px;
    color: #94a3b8;
    font-size: 0.78rem;
    line-height: 1.45;
    text-align: center;
  }

  h2.keypoints-h { margin-top: 18px; }

  .math-label, .refs-empty {
    color: #94a3b8;
    font-size: 0.78rem;
    margin: 16px 0 6px;
    letter-spacing: 0.02em;
  }

  /* ---- Annotated references ---- */
  .ref {
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 11px 13px;
    margin: 10px 0;
    background: #0b1220;
    transition: border-color 0.15s;
  }
  .ref:hover { border-color: #334155; }
  .ref.rec { border-color: #ca8a04; background: #1a1505; }
  .ref-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ref-head a { border-bottom: none; font-weight: 650; line-height: 1.4; }
  .ref-head a:hover { text-decoration: underline; }
  .ref-badge {
    flex: none;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 6px;
    border: 1px solid transparent;
  }
  .ref-badge.paper { background: #172554; color: #93c5fd; border-color: #1e40af; }
  .ref-badge.blog  { background: #052e1a; color: #86efac; border-color: #166534; }
  .ref-badge.video { background: #3b0764; color: #d8b4fe; border-color: #6b21a8; }
  .ref-badge.code  { background: #1f2937; color: #e5e7eb; border-color: #4b5563; }
  .ref-badge.docs  { background: #422006; color: #fdba74; border-color: #9a3412; }
  .ref-rec {
    flex: none;
    font-size: 0.66rem;
    font-weight: 800;
    color: #fbbf24;
    letter-spacing: 0.04em;
  }
  .ref-note { margin-top: 6px; color: #9fb3c8; font-size: 0.82rem; line-height: 1.5; }

  /* ---- Level / altitude tier ---- */
  .lvl-chip {
    display: inline-block;
    margin: 8px 0 14px 8px;
    padding: 5px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
  }
  .lvl-overview { background: #052e1a; color: #86efac; }
  .lvl-core     { background: #172554; color: #93c5fd; }
  .lvl-deep     { background: #3b0764; color: #d8b4fe; }
  .tier-dot { }

  /* ---- See also cross-links ---- */
  .seealso { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .seealso-link {
    cursor: pointer;
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 8px;
    background: #0b1220;
    border: 1px solid #334155;
    color: #93c5fd;
  }
  .seealso-link:hover { background: #172554; border-color: #38bdf8; color: #e0f2fe; }
  .seealso-link::before { content: "↗ "; color: #64748b; }

  /* ---- Toolbar select (level filter) ---- */
  select {
    background: #020617;
    color: var(--text);
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
    font-weight: 600;
    cursor: pointer;
  }
  .zoom-group { display: inline-flex; gap: 4px; align-items: center; }
  .zoom-group button { padding: 8px 12px; min-width: 38px; }
  .zoom-level { color: var(--muted); font-size: 0.8rem; min-width: 42px; text-align: center; }
  .canvas-wrap.grabbing { cursor: grabbing; }
</style>
</head>

<body>
<div class="app">
  <div class="canvas-wrap">
    <div class="toolbar">
      <input id="search" placeholder="Search: MoE, RoPE, DPO, ReAct, YaRN, MLA..." />
      <button type="button" id="btn-expand">Expand all</button>
      <button type="button" id="btn-collapse">Collapse all</button>
      <button type="button" id="btn-reset">Reset view</button>
      <select id="level-filter" title="Filter by depth level">
        <option value="all">All levels</option>
        <option value="overview">Overview only</option>
        <option value="core">Overview + Core</option>
      </select>
      <span class="zoom-group">
        <button type="button" id="btn-zoom-out" title="Zoom out">−</button>
        <span class="zoom-level" id="zoom-level">100%</span>
        <button type="button" id="btn-zoom-in" title="Zoom in">+</button>
        <button type="button" id="btn-zoom-fit" title="Fit to screen">Fit</button>
      </span>
      <span class="hint">Click to expand. Drag to pan, scroll/⌘-scroll or ± to zoom. Deep-link: #node=RoPE</span>
      <span class="search-count" id="search-count"></span>
    </div>
    <svg id="mindmap"></svg>
  </div>

  <aside class="side" id="details"></aside>
</div>

<script>
const DATA = {
  title: "LLM Architectures",
  subtitle: "v2 study / reference map",
  kind: "Root",
  color: "#38bdf8",
  summary: "A working interactive map of large language models: neural backbones, attention and position, scaling, families, training and alignment, inference systems, retrieval, agents, multimodal models, and evaluation.",
  details: [
    "LLM architecture is several stacked layers at once: the neural backbone, the attention and position design, the scaling strategy (dense vs MoE), the training/alignment recipe, the inference system, and the application wrapper (RAG, tools, agents).",
    "Modern chat models are usually decoder-only autoregressive Transformers, but the ecosystem also includes encoder-only models, encoder–decoder models, state-space models, recurrent hybrids, multimodal models, and retrieval/tool-augmented systems.",
    "v1 covered the major conceptual levels. v2 adds model families, long-context methods, a MoE deep dive, alignment algorithms, agent systems, and paper/resource links on the important nodes."
  ],
  resources: [
    { title: "The Illustrated Transformer (Jay Alammar)", url: "https://jalammar.github.io/illustrated-transformer/", type: "blog", recommended: true, note: "The single best starting point for the whole map — builds attention and the Transformer block up visually, one piece at a time. Read before the original paper." },
    { title: "Attention Is All You Need (Vaswani et al., 2017)", url: "https://arxiv.org/abs/1706.03762", type: "paper", note: "The founding paper. Dense, but every branch here descends from it; worth reading once you have the Illustrated version in your head." }
  ],
  children: [
    {
      title: "Backbone Families",
      subtitle: "Core model shapes",
      kind: "Architecture taxonomy",
      color: "#38bdf8",
      summary: "The backbone describes how tokens flow through the network: who can see whom, and whether generation is autoregressive.",
      details: [
        "The first cut is encoder-only vs decoder-only vs encoder–decoder vs non-Transformer (SSM / recurrent / hybrid).",
        "Backbone choice strongly affects natural strengths: understanding, generation, translation, streaming, or multimodal fusion."
      ],
      children: [
        {
          title: "Encoder-only",
          subtitle: "BERT-style",
          kind: "Backbone",
          color: "#60a5fa",
          summary: "Bidirectional models that read the whole input and produce contextual representations.",
          details: [
            "Best for classification, embeddings, retrieval, reranking, token classification, and feature extraction.",
            "Each token attends to both left and right context. Not naturally suited to free-form autoregressive generation."
          ],
          formula: "Input tokens → bidirectional encoder blocks → contextual vectors → classifier / embedding / reranker",
          examples: ["BERT", "RoBERTa", "E5", "GTE", "ModernBERT"],
          resources: [
            { title: "BERT (Devlin et al., 2018)", url: "https://arxiv.org/abs/1810.04805", type: "paper", recommended: true, note: "Defines the encoder-only recipe (masked-LM + next-sentence). Read §3 for the pretraining objectives; the rest is GLUE results." },
            { title: "ModernBERT (Warner et al., 2024)", url: "https://arxiv.org/abs/2412.13663", type: "paper", note: "A 2024 refresh of the BERT recipe (RoPE, longer context, better data) — shows encoder-only is still evolving, not frozen in 2018." }
          ],
          children: [
            {
              title: "Bidirectional Attention",
              subtitle: "See both left and right",
              kind: "Mechanism",
              color: "#93c5fd",
              summary: "Every token can condition on the entire sequence.",
              details: ["Encoder attention masks usually allow every token to attend to every other token.", "This is excellent for representation learning because the model can use full context."]
            },
            {
              title: "Masked LM Objective",
              subtitle: "Predict hidden tokens",
              kind: "Training objective",
              color: "#93c5fd",
              summary: "Random tokens are masked and the model predicts them from context.",
              details: ["The model receives a corrupted input and learns to reconstruct missing pieces.", "This encourages bidirectional understanding rather than left-to-right generation."]
            }
          ]
        },
        {
          title: "Decoder-only",
          subtitle: "GPT / Llama-style",
          kind: "Backbone",
          color: "#4ade80",
          summary: "Autoregressive models that predict the next token from previous tokens.",
          details: [
            "Dominant architecture for chat, code, reasoning, and general-purpose generation.",
            "Causal masking: token t can only attend to tokens ≤ t. Inference appends sampled tokens and feeds them back."
          ],
          formula: "P(x) = Π_t P(x_t | x_<t)\n\nPrompt → causal decoder blocks → next-token distribution → sampled token",
          visual: { svg: "decoder-only", caption: "Each token is predicted from the past, then appended and fed back." },
          examples: ["GPT-2/3/4", "Llama", "Mistral", "Qwen", "Gemma", "DeepSeek"],
          resources: [
            { title: "The Illustrated GPT-2 (Jay Alammar)", url: "https://jalammar.github.io/illustrated-gpt2/", type: "blog", recommended: true, note: "Visual walkthrough of a causal decoder end to end. Start here before the GPT papers." },
            { title: "Language Models are Unsupervised Multitask Learners (GPT-2)", url: "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf", type: "paper", note: "The GPT-2 report — the clearest statement of 'just scale next-token prediction'." },
            { title: "Llama 2 (Touvron et al., 2023)", url: "https://arxiv.org/abs/2307.09288", type: "paper", note: "The reference open decoder recipe; §2 is the architecture + pretraining, later sections are the RLHF chat recipe." }
          ],
          children: [
            {
              title: "Causal Masking",
              subtitle: "No future tokens",
              kind: "Attention mask",
              color: "#86efac",
              summary: "Prevents the model from looking at future tokens during training.",
              details: ["The attention matrix is masked so positions attend only to earlier positions.", "This makes next-token prediction a valid self-supervised objective."],
              visual: { svg: "causal-mask", caption: "Lower-triangular mask: query row t can only see key columns ≤ t." }
            },
            {
              title: "Autoregressive Generation",
              subtitle: "One token at a time",
              kind: "Inference process",
              color: "#86efac",
              summary: "The model repeatedly predicts, samples, and appends tokens.",
              details: ["At step t the model outputs a distribution over the vocabulary.", "A decoding method chooses the next token; it is appended and the loop continues."],
              formula: "for t in range(max_tokens):\n  logits = model(context)\n  token = sample(logits)\n  context.append(token)"
            },
            {
              title: "Instruction-tuned Decoders",
              subtitle: "Chat models",
              kind: "Model variant",
              color: "#86efac",
              summary: "Base decoder models further trained to follow user instructions.",
              details: ["A base model learns broad language modeling from pretraining.", "SFT teaches format and tasks; RLHF / DPO / RLAIF then shape preference and refusal behavior."]
            }
          ]
        },
        {
          title: "Encoder–Decoder",
          subtitle: "T5 / BART-style",
          kind: "Backbone",
          color: "#facc15",
          summary: "One stack reads the input; another stack generates the output.",
          details: [
            "Good for translation, summarization, transformation, and structured input→output tasks.",
            "The encoder is bidirectional; the decoder is causal and cross-attends to encoder states. The original Transformer was this shape."
          ],
          formula: "source → encoder → memory\n                  ↓ cross-attention\ntarget prefix → decoder → next target token",
          visual: { svg: "encoder-decoder", caption: "A bidirectional encoder reads the source; a causal decoder cross-attends to it while writing." },
          examples: ["T5", "BART", "UL2", "Flan-T5", "MADLAD"],
          resources: [
            { title: "T5 (Raffel et al., 2019)", url: "https://arxiv.org/abs/1910.10683", type: "paper", recommended: true, note: "The 'text-to-text' framing that unified NLP tasks. Skim the intro + the input/output format figures; the ablations are long." },
            { title: "BART (Lewis et al., 2019)", url: "https://arxiv.org/abs/1910.13461", type: "paper", note: "Denoising encoder-decoder; a good contrast to T5's span corruption. Strong for summarization." }
          ],
          children: [
            {
              title: "Cross-Attention",
              subtitle: "Decoder attends to encoder",
              kind: "Attention type",
              color: "#fde68a",
              summary: "Lets the decoder condition generation on the encoded source.",
              details: ["Queries come from decoder states; keys and values come from encoder outputs.", "This separates reading the source from writing the target."],
              formula: "Q = decoder hidden states\nK, V = encoder hidden states\nAttention(Q, K, V)"
            },
            {
              title: "Text-to-Text Framing",
              subtitle: "Everything as text",
              kind: "Task formulation",
              color: "#fde68a",
              summary: "Tasks are represented as text input to text output.",
              details: ["Examples: 'translate English to French: ...', 'summarize: ...'.", "This unifies many NLP tasks under one training and inference format."]
            }
          ]
        },
        {
          title: "State-Space Models",
          subtitle: "Mamba-like",
          kind: "Alternative backbone",
          color: "#fb923c",
          summary: "Sequence models based on learned state updates rather than full pairwise attention.",
          details: [
            "SSMs process sequences through a hidden state and can scale more favorably with length than quadratic attention.",
            "Modern SSMs (Mamba) use selective, input-dependent dynamics. Attractive for long-context and streaming."
          ],
          formula: "state_t = A(x_t) state_{t-1} + B(x_t) x_t\noutput_t = C(x_t) state_t",
          visual: { svg: "ssm", caption: "Information flows through a carried state, not an all-pairs attention matrix." },
          examples: ["S4", "Mamba", "Mamba-2", "Jamba (hybrid)"],
          resources: [
            { title: "Mamba (Gu & Dao, 2023)", url: "https://arxiv.org/abs/2312.00752", type: "paper", recommended: true, note: "The selective-SSM paper that made state-space models competitive with attention on language. The intro + §3 give the core idea." },
            { title: "A Visual Guide to Mamba (Maarten Grootendorst)", url: "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-mamba-and-state", type: "blog", note: "Gentle illustrated intro to SSMs and Mamba if the paper's control-theory notation is heavy going." },
            { title: "Mamba-2 (Dao & Gu, 2024)", url: "https://arxiv.org/abs/2405.21060", type: "paper", note: "Reframes SSMs and attention as duals (SSD); read once Mamba-1 makes sense." }
          ],
          children: [
            {
              title: "Selective State Update",
              subtitle: "Input-dependent dynamics",
              kind: "Mechanism",
              color: "#fdba74",
              summary: "The transition behavior changes depending on the token.",
              details: ["Older SSMs often used fixed dynamics.", "Selective SSMs make parameters depend on input, improving expressiveness on discrete language."]
            },
            {
              title: "Linear-Time Sequence Processing",
              subtitle: "Long-context efficiency",
              kind: "Efficiency idea",
              color: "#fdba74",
              summary: "Avoids explicitly comparing all token pairs.",
              details: ["Full attention is O(n²) in sequence length.", "State-based recurrence can process sequences closer to O(n), with practical kernels mattering a lot."]
            }
          ]
        },
        {
          title: "Recurrent Hybrids",
          subtitle: "RWKV-like",
          kind: "Alternative backbone",
          color: "#f87171",
          summary: "Architectures that aim for Transformer-like training and RNN-like inference.",
          details: [
            "They maintain a recurrent state at inference time, so they need not store a large KV cache the same way.",
            "The bet is parallelizable training plus streaming generation. Tradeoff: less direct random access to arbitrary past tokens."
          ],
          formula: "h_t = f(h_{t-1}, x_t)\ny_t = g(h_t)",
          examples: ["RWKV", "RetNet", "xLSTM"],
          resources: [{ title: "RWKV (Peng et al., 2023)", url: "https://arxiv.org/abs/2305.13048", type: "paper", recommended: true, note: "The clearest 'Transformer-training, RNN-inference' hybrid write-up; explains the time-mixing / channel-mixing trick." }],
          children: [

const svg = document.getElementById("mindmap");
const detailsEl = document.getElementById("details");
const searchEl = document.getElementById("search");
const searchCountEl = document.getElementById("search-count");
const levelFilterEl = document.getElementById("level-filter");
const zoomLevelEl = document.getElementById("zoom-level");
const canvasWrap = document.querySelector(".canvas-wrap");

const NODE_W = 258;
const NODE_H = 66;
const H_GAP = 76;
const V_GAP = 14;
const PAD = 36;

const expanded = new Set();
let selectedId = null;
let query = "";
let levelCap = 2;        // 0=overview,1=core,2=all — driven by the level filter
let zoom = 1;            // canvas zoom factor
const TITLE_INDEX = {};  // title -> node, for see-also + deep-link

function walk(node, fn, parent = null) {
  fn(node, parent);
  (node.children || []).forEach((c) => walk(c, fn, node));
}

function assignIds(node, path = "0") {
  node.id = path;
  (node.children || []).forEach((c, i) => assignIds(c, `${path}.${i}`));
}

// Assign altitude tier + build the title index. Called once at init.
function annotateTree() {
  (function visit(node, depth) {
    node._tier = tierOf(node, depth);
    if (!TITLE_INDEX[node.title]) TITLE_INDEX[node.title] = node;
    (node.children || []).forEach((c) => visit(c, depth + 1));
  })(DATA, 0);
}

// Expand every ancestor of a node id so it becomes visible.
function expandAncestors(id) {
  const parts = id.split(".");
  let acc = parts[0];
  expanded.add(acc);
  for (let i = 1; i < parts.length; i++) { acc += "." + parts[i]; expanded.add(acc); }
}

// Navigate to a node by title: expand its path, select it, scroll it into view.
function gotoTitle(title) {
  const node = TITLE_INDEX[title];
  if (!node) return;
  // A see-also target may be hidden by the level filter — lift the cap if so.
  if (TIER_RANK[node._tier || "core"] > levelCap) { levelCap = 2; levelFilterEl.value = "all"; }
  expandAncestors(node.id);
  selectedId = node.id;
  showDetails(node);
  render();
  scrollNodeIntoView(node);
  if (history.replaceState) history.replaceState(null, "", "#node=" + encodeURIComponent(title));
}

function scrollNodeIntoView(node) {
  if (node.x == null) return;
  const cx = (node.x + NODE_W / 2) * zoom;
  const cy = (node.y + NODE_H / 2) * zoom;
  canvasWrap.scrollTo({
    left: Math.max(0, cx - canvasWrap.clientWidth / 2),
    top: Math.max(0, cy - canvasWrap.clientHeight / 2),
    behavior: "smooth"
  });
}

function hasKids(node) {
  return !!(node.children && node.children.length);
}

function nodeText(node) {
  return [
    node.title,
    node.subtitle,
    node.kind,
    node.summary,
    ...(node.details || []),
    ...(node.examples || []),
    node.formula || "",
    ...((node.resources || []).map((r) => r.title))
  ].join(" ").toLowerCase();
}

function matchesQuery(node) {
  if (!query) return false;
  return nodeText(node).includes(query);
}

function visibleKids(node) {
  if (!hasKids(node) || !expanded.has(node.id)) return [];
  if (levelCap >= 2) return node.children;
  // Level filter: hide children whose tier is deeper than the cap.
  return node.children.filter((c) => TIER_RANK[c._tier || "core"] <= levelCap);
}

function measure(node) {
  const kids = visibleKids(node);
  if (!kids.length) {
    node._h = NODE_H;
    return NODE_H;
  }
  let total = 0;
  kids.forEach((c, i) => {
    total += measure(c);
    if (i) total += V_GAP;
  });
  node._h = Math.max(NODE_H, total);
  return node._h;
}

function place(node, x, yTop) {
  const kids = visibleKids(node);
  if (!kids.length) {
    node.x = x;
    node.y = yTop;
    return;
  }
  let y = yTop;
  kids.forEach((c) => {
    place(c, x + NODE_W + H_GAP, y);
    y += c._h + V_GAP;
  });
  node.x = x;
  node.y = (kids[0].y + kids[kids.length - 1].y) / 2;
}

function collect(node, out = []) {
  out.push(node);
  visibleKids(node).forEach((c) => collect(c, out));
  return out;
}

function findNode(id, node = DATA) {
  if (node.id === id) return node;
  for (const c of node.children || []) {
    const hit = findNode(id, c);
    if (hit) return hit;
  }
  return null;
}

function breadcrumb(node) {
  const parts = [];
  walk(DATA, (n, parent) => {
    n._parent = parent;
  });
  let cur = node;
  while (cur) {
    parts.push(cur.title);
    cur = cur._parent;
  }
  return parts.reverse().join(" / ");
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Resolve a node's visual: an inline-SVG key from the VISUALS library, or an image URL.
function visualHtml(node) {
  const v = node.visual;
  if (!v) return "";
  let body = "";
  if (v.svg && VISUALS[v.svg]) {
    body = VISUALS[v.svg];
  } else if (v.img) {
    body = `<img src="${escapeHtml(v.img)}" alt="${escapeHtml(v.caption || node.title)}" loading="lazy" />`;
  } else return "";
  const cap = v.caption ? `<div class="viz-caption">${escapeHtml(v.caption)}</div>` : "";
  return `<div class="visual">
    <div class="viz-toolbar">
      <span class="viz-hint">Scroll to zoom · drag to pan</span>
      <button type="button" class="viz-zoom-out" title="Zoom out">−</button>
      <span class="viz-zoom-level">100%</span>
      <button type="button" class="viz-zoom-in" title="Zoom in">+</button>
      <button type="button" class="viz-zoom-reset" title="Reset view">Reset</button>
    </div>
    <div class="viz-viewport">
      <div class="viz-stage">${body}</div>
    </div>
    ${cap}
  </div>`;
}

function bindVisualZoom(root) {
  root.querySelectorAll(".visual").forEach((visual) => {
    const viewport = visual.querySelector(".viz-viewport");
    const stage = visual.querySelector(".viz-stage");
    const levelEl = visual.querySelector(".viz-zoom-level");
    if (!viewport || !stage) return;

    let scale = 1;
    let tx = 0;
    let ty = 0;
    const MIN = 0.5;
    const MAX = 4;

    function apply() {
      stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      if (levelEl) levelEl.textContent = Math.round(scale * 100) + "%";
    }

    function clampScale(s) {
      return Math.min(MAX, Math.max(MIN, s));
    }

    function setScale(next) {
      scale = clampScale(next);
      apply();
    }

    visual.querySelector(".viz-zoom-in")?.addEventListener("click", () => setScale(scale * 1.25));
    visual.querySelector(".viz-zoom-out")?.addEventListener("click", () => setScale(scale / 1.25));
    visual.querySelector(".viz-zoom-reset")?.addEventListener("click", () => {
      scale = 1; tx = 0; ty = 0; apply();
    });

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      setScale(scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
    }, { passive: false });

    viewport.addEventListener("dblclick", () => {
      scale = 1; tx = 0; ty = 0; apply();
    });

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    viewport.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      viewport.classList.add("grabbing");
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      tx += e.clientX - lastX;
      ty += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      apply();
    });
    const endDrag = () => {
      dragging = false;
      viewport.classList.remove("grabbing");
    };
    viewport.addEventListener("pointerup", endDrag);
    viewport.addEventListener("pointercancel", endDrag);
  });
}

// One annotated reference card. Accepts {title,url,type,note,recommended}.
function refHtml(r) {
  const type = (r.type || "paper").toLowerCase();
  const badge = `<span class="ref-badge ${escapeHtml(type)}">${escapeHtml(type)}</span>`;
  const rec = r.recommended ? `<span class="ref-rec">★ start here</span>` : "";
  const note = r.note ? `<div class="ref-note">${escapeHtml(r.note)}</div>` : "";
  return `<div class="ref${r.recommended ? " rec" : ""}">
      <div class="ref-head">${badge}<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title)}</a>${rec}</div>
      ${note}
    </div>`;
}

// Build "see also" chips; only link to titles that actually exist in the tree.
function seeAlsoHtml(node) {
  const targets = (SEE_ALSO[node.title] || []).filter((t) => TITLE_INDEX[t]);
  if (!targets.length) return "";
  const chips = targets
    .map((t) => `<span class="seealso-link" data-goto="${escapeHtml(t)}">${escapeHtml(t)}</span>`)
    .join("");
  return `<h2>See also</h2><div class="seealso">${chips}</div>`;
}

function showDetails(node) {
  const examples = (node.examples || [])
    .map((e) => `<span class="pill">${escapeHtml(e)}</span>`)
    .join("");
  const details = (node.details || []).map((d) => `<li>${escapeHtml(d)}</li>`).join("");

  // Merge any externally-curated references (REFS by title) onto the node once.
  const merged = (node.resources || []).concat(
    !node._refsMerged && REFS[node.title] ? REFS[node.title] : []
  );
  if (!node._refsMerged && REFS[node.title]) { node.resources = merged; node._refsMerged = true; }

  // Sort references so the recommended "start here" entry leads.
  const refList = (node.resources || []).slice().sort((a, b) => (b.recommended ? 1 : 0) - (a.recommended ? 1 : 0));
  const resources = refList.map(refHtml).join("");

  const kids = (node.children || [])
    .map((c) => `<li><strong>${escapeHtml(c.title)}</strong> — ${escapeHtml(c.subtitle || c.kind || "")}</li>`)
    .join("");

  // formula may be real math or an ASCII sketch; label it as "Math / sketch".
  const mathBlock = node.formula
    ? `<div class="math-label">Math / sketch</div><div class="formula">${escapeHtml(node.formula)}</div>`
    : "";

  const tier = node._tier || "core";
  const lvlChip = `<span class="lvl-chip lvl-${tier}">${escapeHtml(TIER_LABEL[tier])}</span>`;

  detailsEl.innerHTML = `
    <div class="breadcrumb">${escapeHtml(breadcrumb(node))}</div>
    <h1>${escapeHtml(node.title)}</h1>
    <span class="kind">${escapeHtml(node.kind || "")}</span>${lvlChip}

    <div class="part-label">What it is</div>
    <p class="whatis">${escapeHtml(node.summary || "")}</p>
    ${visualHtml(node)}
    ${examples ? `<div class="legend">${examples}</div>` : ""}
    ${details ? `<h2 class="keypoints-h">Key points</h2><ul>${details}</ul>` : ""}
    ${mathBlock}
    ${seeAlsoHtml(node)}
    ${kids ? `<h2>Drill down</h2><ul>${kids}</ul>` : ""}

    <div class="part-label refs">References worth reading</div>
    ${resources || `<div class="refs-empty">No vetted reference for this node yet — the parent branch lists the foundational papers.</div>`}

    <p class="hint">${hasKids(node) ? "Click the node again to collapse / expand its children." : "Leaf node — see the parent branch for broader context."}</p>
  `;

  // Wire up see-also navigation.
  detailsEl.querySelectorAll(".seealso-link").forEach((el) => {
    el.addEventListener("click", () => gotoTitle(el.getAttribute("data-goto")));
  });
  bindVisualZoom(detailsEl);
}

function expandAncestorsOfMatches() {
  if (!query) return 0;
  let hits = 0;
  function visit(node) {
    let childHit = false;
    (node.children || []).forEach((c) => {
      if (visit(c)) childHit = true;
    });
    const self = matchesQuery(node);
    if (self) hits += 1;
    if (self || childHit) expanded.add(node.id);
    return self || childHit;
  }
  visit(DATA);
  return hits;
}

function ns(tag) {
  return document.createElementNS("http://www.w3.org/2000/svg", tag);
}

function render() {
  measure(DATA);
  place(DATA, PAD, PAD);
  const nodes = collect(DATA);
  let maxX = 0;
  let maxY = 0;
  nodes.forEach((n) => {
    maxX = Math.max(maxX, n.x + NODE_W);
    maxY = Math.max(maxY, n.y + NODE_H);
  });
  const W = maxX + PAD;
  const H = maxY + PAD;
  // viewBox holds model coordinates; width/height apply the zoom factor.
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W * zoom);
  svg.setAttribute("height", H * zoom);
  svg.style.minWidth = (W * zoom) + "px";
  svg.style.minHeight = (H * zoom) + "px";
  svg.innerHTML = "";

  nodes.forEach((n) => {
    visibleKids(n).forEach((c) => {
      const path = ns("path");
      const x1 = n.x + NODE_W;
      const y1 = n.y + NODE_H / 2;
      const x2 = c.x;
      const y2 = c.y + NODE_H / 2;
      const mid = (x1 + x2) / 2;
      path.setAttribute("d", `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`);
      path.setAttribute("class", "link");
      svg.appendChild(path);
    });
  });

  nodes.forEach((n) => {
    const g = ns("g");
    g.setAttribute("class", "node-card");
    g.addEventListener("click", (e) => {
      e.stopPropagation();
      selectedId = n.id;
      if (hasKids(n)) {
        if (expanded.has(n.id)) expanded.delete(n.id);
        else expanded.add(n.id);
      }
      showDetails(n);
      render();
      if (history.replaceState) history.replaceState(null, "", "#node=" + encodeURIComponent(n.title));
    });

    const rect = ns("rect");
    rect.setAttribute("x", n.x);
    rect.setAttribute("y", n.y);
    rect.setAttribute("width", NODE_W);
    rect.setAttribute("height", NODE_H);
    rect.setAttribute("class", "node-rect");
    rect.setAttribute("fill", n.color || "#334155");
    rect.setAttribute("fill-opacity", "0.22");
    if (query && matchesQuery(n)) rect.classList.add("hit");
    if (n.id === selectedId) rect.classList.add("selected");
    g.appendChild(rect);

    const mark = hasKids(n) ? (expanded.has(n.id) ? "▾ " : "▸ ") : "";
    const title = ns("text");
    title.setAttribute("class", "node-title");
    title.setAttribute("x", n.x + 14);
    title.setAttribute("y", n.y + 22);
    title.textContent = mark + n.title;
    g.appendChild(title);

    const sub = ns("text");
    sub.setAttribute("class", "node-sub");
    sub.setAttribute("x", n.x + 14);
    sub.setAttribute("y", n.y + 40);
    sub.textContent = n.subtitle || "";
    g.appendChild(sub);

    const meta = ns("text");
    meta.setAttribute("class", "node-meta");
    meta.setAttribute("x", n.x + 14);
    meta.setAttribute("y", n.y + 56);
    meta.textContent = n.kind || "";
    g.appendChild(meta);

    svg.appendChild(g);
  });
}

function expandAll() {
  walk(DATA, (n) => {
    if (hasKids(n)) expanded.add(n.id);
  });
  render();
}

function collapseAll() {
  expanded.clear();
  expanded.add(DATA.id);
  render();
}

function resetView() {
  query = "";
  searchEl.value = "";
  searchCountEl.textContent = "";
  levelCap = 2;
  levelFilterEl.value = "all";
  applyZoom(1);
  expanded.clear();
  expanded.add(DATA.id);
  (DATA.children || []).forEach((c) => expanded.add(c.id));
  selectedId = DATA.id;
  showDetails(DATA);
  render();
  if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  canvasWrap.scrollTo({ left: 0, top: 0 });
}

function onSearch() {
  query = searchEl.value.trim().toLowerCase();
  if (!query) {
    searchCountEl.textContent = "";
    render();
    return;
  }
  const hits = expandAncestorsOfMatches();
  searchCountEl.textContent = hits ? `${hits} match${hits === 1 ? "" : "es"}` : "no matches";
  render();
}

// ---- Zoom ----
function applyZoom(z) {
  zoom = Math.min(2.2, Math.max(0.35, z));
  zoomLevelEl.textContent = Math.round(zoom * 100) + "%";
  render();
}
function zoomIn()  { applyZoom(zoom * 1.2); }
function zoomOut() { applyZoom(zoom / 1.2); }
function zoomFit() {
  measure(DATA); place(DATA, PAD, PAD);
  const nodes = collect(DATA);
  let maxX = 0, maxY = 0;
  nodes.forEach((n) => { maxX = Math.max(maxX, n.x + NODE_W); maxY = Math.max(maxY, n.y + NODE_H); });
  const W = maxX + PAD, H = maxY + PAD;
  const z = Math.min(canvasWrap.clientWidth / W, canvasWrap.clientHeight / H);
  applyZoom(z);
  canvasWrap.scrollTo({ left: 0, top: 0 });
}

// ---- Level filter ----
function onLevelFilter() {
  const v = levelFilterEl.value;
  levelCap = v === "overview" ? 0 : v === "core" ? 1 : 2;
  render();
}

// ---- Drag-to-pan ----
function wireDragPan() {
  let dragging = false, sx = 0, sy = 0, sl = 0, st = 0, moved = false;
  canvasWrap.addEventListener("mousedown", (e) => {
    // ignore clicks that land on a node (let the node handler run)
    if (e.target.closest(".node-card")) return;
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY; sl = canvasWrap.scrollLeft; st = canvasWrap.scrollTop;
    canvasWrap.classList.add("grabbing");
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    canvasWrap.scrollLeft = sl - dx;
    canvasWrap.scrollTop = st - dy;
  });
  window.addEventListener("mouseup", () => { dragging = false; canvasWrap.classList.remove("grabbing"); });
  // Ctrl/Cmd + wheel to zoom at the cursor region.
  canvasWrap.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    applyZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
  }, { passive: false });
}

// ---- Deep link (#node=Title) ----
function openFromHash() {
  const m = /#node=([^&]+)/.exec(location.hash || "");
  if (!m) return false;
  const title = decodeURIComponent(m[1]);
  if (TITLE_INDEX[title]) { gotoTitle(title); return true; }
  return false;
}

assignIds(DATA);
annotateTree();
expanded.add(DATA.id);
(DATA.children || []).forEach((c) => expanded.add(c.id));
selectedId = DATA.id;
showDetails(DATA);
render();

document.getElementById("btn-expand").addEventListener("click", expandAll);
document.getElementById("btn-collapse").addEventListener("click", collapseAll);
document.getElementById("btn-reset").addEventListener("click", resetView);
document.getElementById("btn-zoom-in").addEventListener("click", zoomIn);
document.getElementById("btn-zoom-out").addEventListener("click", zoomOut);
document.getElementById("btn-zoom-fit").addEventListener("click", zoomFit);
levelFilterEl.addEventListener("change", onLevelFilter);
searchEl.addEventListener("input", onSearch);
window.addEventListener("hashchange", openFromHash);
wireDragPan();
openFromHash();
</script>
</body>
</html>
